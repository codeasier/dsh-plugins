name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Use NPM_TOKEN for this run (required for a new package's first publish)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify before versioning or publishing
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm check:conventions
          pnpm check:docs
          pnpm pack:check

      - name: Create Version Packages PR or publish
        uses: changesets/action@v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release:ci
          commitMode: github-api
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC is used only once RELEASE_PUBLISH=true; until then, and for an
          # explicit bootstrap run, the token keeps publishing working.
          NODE_AUTH_TOKEN: ${{ (inputs.bootstrap == true || vars.RELEASE_PUBLISH != 'true') && secrets.NPM_TOKEN || '' }}
          RELEASE_BOOTSTRAP: ${{ inputs.bootstrap }}
          RELEASE_PUBLISH: ${{ vars.RELEASE_PUBLISH }}
